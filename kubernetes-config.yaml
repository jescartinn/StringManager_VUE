apiVersion: apps/v1
kind: Deployment
metadata:
  name: stringmanager-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stringmanager-frontend
  template:
    metadata:
      labels:
        app: stringmanager-frontend
    spec:
      containers:
      - name: stringmanager-frontend
        image: jaimeescartinsv/tfg:stringmanager-frontend
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_URL
          value: "https://api.stringmanager.work.gd/api"
---
apiVersion: v1
kind: Service
metadata:
  name: stringmanager-service-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:us-east-1:354567012970:certificate/5de3a32f-02bd-4ba9-bf52-c9de4dcb913b
    # Only run TLS on the port named "https" below.
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
spec:
  selector:
    app: stringmanager-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 80
  type: LoadBalancer